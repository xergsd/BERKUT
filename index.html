<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Беркут</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3b07a; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 16px; left: 16px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.35); pointer-events: none; }
  #dist { font-size: 34px; font-weight: 800; letter-spacing: 1px; }
  #best, #biome { font-size: 14px; opacity: .9; margin-top: 2px; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             color: #fff; text-align: center; background: rgba(40, 20, 40, .25); text-shadow: 0 2px 12px rgba(0,0,0,.4);
             cursor: pointer; transition: opacity .3s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #ov-title { font-size: clamp(36px, 8vw, 72px); font-weight: 900; letter-spacing: 4px; }
  #ov-text { font-size: 18px; line-height: 1.6; margin-top: 12px; }
</style>
<!-- Three.js r128 как ES-модуль. Аддоны (bloom и т.п.) грузить с того же CDN и той же версии. -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js" } }
</script>
</head>
<body>
  <div id="hud">
    <div id="dist">0 м</div>
    <div id="best">Рекорд: 0 м</div>
    <div id="biome">Степь</div>
  </div>
  <div id="overlay">
    <div id="ov-title">БЕРКУТ</div>
    <div id="ov-text"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
