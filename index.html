<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Беркут</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3b07a; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 16px; left: 16px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.35); pointer-events: none; }
  #score { font-size: 40px; font-weight: 900; letter-spacing: 1px; }
  #mult { font-size: 16px; font-weight: 700; color: #ffe08a; min-height: 20px; }
  #dist { font-size: 18px; font-weight: 700; margin-top: 4px; }
  #best, #biome { font-size: 14px; opacity: .9; margin-top: 2px; }
  #stamina { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); width: min(320px, 70vw); height: 12px;
             border-radius: 6px; background: rgba(0,0,0,.3); overflow: hidden; pointer-events: none; transition: opacity .3s; }
  #stamina.hidden { opacity: 0; }
  #stamina-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #7fd36b, #d8f07a); transition: width .1s linear; }
  #stamina.locked #stamina-fill { background: #ff8a4a; }
  #popups { position: fixed; left: 50%; top: 32%; transform: translateX(-50%); pointer-events: none; text-align: center; }
  .popup { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.45); animation: pop 1.2s ease-out forwards; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 15% { transform: scale(1.1); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             color: #fff; text-align: center; background: rgba(40, 20, 40, .25); text-shadow: 0 2px 12px rgba(0,0,0,.4);
             cursor: pointer; transition: opacity .3s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #ov-title { font-size: clamp(36px, 8vw, 72px); font-weight: 900; letter-spacing: 4px; }
  #ov-text { font-size: 18px; line-height: 1.6; margin-top: 12px; }
</style>
<!-- Three.js r128 как ES-модуль. Аддоны (bloom и т.п.) грузить с того же CDN и той же версии. -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js" } }
</script>
</head>
<body>
  <div id="hud">
    <div id="score">0</div>
    <div id="mult"></div>
    <div id="dist">0 м</div>
    <div id="best">Рекорд: 0 очков · 0 м</div>
    <div id="biome">Степь</div>
  </div>
  <div id="stamina" class="hidden"><div id="stamina-fill"></div></div>
  <div id="popups"></div>
  <div id="overlay">
    <div id="ov-title">БЕРКУТ</div>
    <div id="ov-text"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
